<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オフライン | 体重管理ツール</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070a0f; color: #e2e8f0;
         font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; padding: 16px; box-sizing: border-box; }
  .card { max-width: 360px; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 20px; background: rgba(255,255,255,.04); }
  h1 { font-size: 20px; margin: 0 0 8px; color: #a3ff12; }
  p { font-size: 14px; line-height: 1.7; margin: 0 0 12px; color: #cbd5e1; }
  button { width: 100%; height: 44px; border: 0; border-radius: 8px; background: #a3ff12; color: #061006; font-weight: 800; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>オフラインです</h1>
    <p>電波が戻ると自動で再読み込みします。ホーム画面を開いたまま電波が切れた場合、そこで記録した体重・食事・水分は端末に一時保存され、オンライン復帰時に送信されます。</p>
    <button onclick="location.reload()">再読み込み</button>
  </div>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
